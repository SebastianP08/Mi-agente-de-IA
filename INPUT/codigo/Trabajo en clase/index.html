<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado 2 — Grid Básico (para completar en clase)</title>
</head>

<style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1{
      color:#d813ff
    }

    p{
      color:black;
    }

    body.dark-mode{
        background-color: #000000;
    }

    .dark-mode h1, p{
      color: white;
    }

    /* ==========================================
       ESTADO 2 — Grid Básico (SIN RESOLVER a propósito)
       Este es el punto de partida para escribirlo en vivo en clase.
       Sigue los TODO en orden — cada uno agrega UNA propiedad de la
       tabla "Propiedades del contenedor" del recurso de Grid/Flexbox
       (semana_03_recurso_css_grid_flexbox_tailwind.md).
    ========================================== */
    .grid-container {

      /* TODO 1: activa Grid en este contenedor.
         Propiedad: display
         Valor: grid
      */
      display: grid;
      /* TODO 2: define 3 columnas de 200px cada una.
         Propiedad: grid-template-columns
         Pista: puedes escribir "200px 200px 200px" a mano,
         o usar el atajo repeat(3, 200px) — ambos hacen lo mismo.
      */
      grid-template-columns: repeat(3, auto);

      /* TODO 3: agrega espacio entre las celdas, sin usar márgenes.
         Propiedad: gap
         Valor sugerido: 15px
      */
      gap: 20px;
      /* Ya viene incluido, no lo toques: */
      background-color: #ecf0f1;
      padding: 15px;
      border-radius: 8px;
    }

    .dark-mode .grid-container{
      background-color: rgb(255, 167, 52);
    }

    .grid-item {
      background-color: #3498db;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }

    .dark-mode .grid-item{
      background-color: #7e7e7e;
      color: black;
    }

    .grid-container2 {

      /* TODO 1: activa Grid en este contenedor.
         Propiedad: display
         Valor: grid
      */
      display: grid;
      /* TODO 2: define 3 columnas de 200px cada una.
         Propiedad: grid-template-columns
         Pista: puedes escribir "200px 200px 200px" a mano,
         o usar el atajo repeat(3, 200px) — ambos hacen lo mismo.
      */
      grid-template-columns: repeat(3, auto);

      /* TODO 3: agrega espacio entre las celdas, sin usar márgenes.
         Propiedad: gap
         Valor sugerido: 15px
      */
      gap: 20px;
      /* Ya viene incluido, no lo toques: */
      background-color: #24d3ff;
      padding: 15px;
      border-radius: 0px;
    }

    .grid-item2 {
      background-color: #3498db;
      color: rgb(230, 255, 3);
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }

    .grid-container3 {
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 20px;
      background-color: #ecf0f1;
      padding: 15px;
      border-radius: 8px;
    }

    .grid-item3 {
      background-color: #9b59b6;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }

    button{
      padding: 15px;
      margin-top: 5px;
      border-radius: 20px;
      font-size: 16px;
    }

    button:hover{
      background-color: #a1a1a1;
    }

    /* TODO 4 (opcional, para quien termine antes): alinea el
       contenido de cada celda al centro verticalmente.
       Propiedad: align-items (va en .grid-container, no en .grid-item)
       Valor: center
    */

@media (min-width: 500px) {
      body {
        background-color: #98FB98; /* Verde = ya estamos en tablet */
      }
      .grid-item {
        background-color: #000000;
        font-size: 2rem; /* el texto también puede cambiar, no solo el color */
      }
    }

@media (min-width: 700px) {
      body{
        background-color: rgb(255, 255, 199);
      }
      h1{
        font-size: 4rem;
        color:#000000;
      }
      p{
        color:#000000;
      }
      .grid-container{
        background-color: rgb(110, 88, 55);
      }
      .grid-item {
        border-radius: 30px;
        text-align: left;
      }
      .grid-container2{
        display: none;
      }
      .grid-item2 {
        display: none;  
        color:#ffffff;
    }
    }
</style>
<body>
  <h1 id="titulo">Mi Primer Grid</h1>
  <p id="descripcion">Grid con 3 columnas de 200px cada una — completa los TODO del CSS.</p>

  <div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
    <div class="grid-item">5</div>
    <div class="grid-item">6</div>
    <div class="grid-item">7</div>
    <div class="grid-item">8</div>
    <div id="demo"class="grid-item">9</div>
  </div>

  <button id="boton">Botón</button>
  <button id="boton2">Oscurito</button>

  <div id="caja2" class="grid-container2">
    <div class="grid-item2">1</div>
    <div class="grid-item2">2</div>
    <div class="grid-item2">3</div>
  </div>

  <div id="caja3" class="grid-container3">
    <div class="grid-item3">1</div>
    <div class="grid-item3">2</div>
    <div class="grid-item3">3</div>
  </div>

  <div id="caja4" class="grid-container4">
    <div class="grid-item3">1</div>
    <div class="grid-item3">2</div>
    <div class="grid-item3">3</div>
  </div>

  <button id="btn3">Grid4</button>
  <script>
    // Buscamos el div #demo (celda 9 del primer grid) y le cambiamos
    // el texto apenas carga la página.
    let txt = document.getElementById("demo");
    txt.textContent="Hola mundo"

    const btn3= document.getElementById("btn3");

    const titulo = document.getElementById("titulo")
    const descripcion = document.getElementById("descripcion")

    // Cuando se hace click en "Botón", cambia el texto de esa misma celda.
    let btnMsg = document.getElementById("boton");
    btnMsg.addEventListener("click", function () {
      console.log("Botón clickeado");
        txt.textContent="Estoy en clase de Lenguajes";
    });

    // Botón de modo oscuro: alterna la clase "dark-mode" en el <body>
    // (esa clase está definida en el CSS y cambia el fondo/color de texto)
    // y actualiza el texto del botón según quede activada o no.
    let btn2 = document.getElementById("boton2");
    btn2.addEventListener("click", function () {
    document.body.classList.toggle("dark-mode")
    if(document.body.classList.contains("dark-mode"))
    {btn2.textContent = "Modo Claro";}
      else{btn2.textContent = "Oscurito"; }
      });

    // Ocultar/mostrar la caja 3 por JS (no por CSS), replicando el
    // breakpoint de 700px que ya usa .grid-container2/.grid-item2.
    let caja3 = document.getElementById("caja3");

    // matchMedia crea un "media query" que podemos consultar y escuchar
    // desde JS, igual que un @media en CSS pero programático.
    let mqCaja3 = window.matchMedia("(min-width: 700px)");

    // "e" es el objeto del media query: e.matches es true cuando el
    // ancho de la ventana cumple la condición (>= 700px).
    function toggleCaja3(e) {
      caja3.style.display = e.matches ? "none" : "grid";
    }

    // La llamamos una vez al cargar, para que la caja arranque en el
    // estado correcto según el tamaño inicial de la ventana...
    toggleCaja3(mqCaja3);
    // ...y la suscribimos a los cambios, para que se actualice cada vez
    // que la ventana cruza el umbral de 700px (se agranda o se achica).
    mqCaja3.addEventListener("change", toggleCaja3);


      //Esta es una de las formas en las que se puede ocular un elemento a travez 
      //de un boton en java.
      const gc4 = document.querySelector(".grid-container4");
      btn3.addEventListener ("click" , function(){
        alert("Hola mundo 3");
        gc4.style.display = "none";
      })

      function resize(){

        if (window.innerWidth >= 1024){
          titulo.textContent = "Modo Desktop";
          descripcion.textContent = "Asi se vera el texto cuando esta en tamaño desktop";
        }
        else if(window.innerWidth >= 768){
          titulo.textContent = "Modo Tablet";
          descripcion.textContent = "Asi se ve el texto en dispositivos tablet";
        }
        else{
          titulo.textContent = "Modo Telefono";
          descripcion.textContent = "Y esta es su versión movil";
        }
      }
      
      window.addEventListener("resize", resize);
      resize();
  </script>
</body>
</html>

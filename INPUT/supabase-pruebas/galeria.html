<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería — Jaziz</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Tarjetas, filtros, modal y carrito: compartido con cliente.html -->
  <link rel="stylesheet" href="css/catalogo.css">
  <link rel="stylesheet" href="css/perfil.css">
  <style>
    /* Misma paleta Jaziz que admin.html */
    :root {
      --bg: #1a0a10;
      --surface: #26101a;
      --surface-2: #341824;
      --border: #4a2333;
      --text: #f2f2f2;
      --text-muted: #c9a9b3;
      --accent: #d67474;
      --accent-hover: #e89a9a;
      --accent-text: #1a0a10;
      --card-media: #3d1a29;
      --tag-bg: #3d1a29;
      --tag-text: #f2c4cf;
      --shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
      --success: #6fcf97;
      --danger: #ff6b6b;
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg: #f2f2f2;
      --surface: #ffffff;
      --surface-2: #f8eeee;
      --border: #ead7d7;
      --text: #1a1a1a;
      --text-muted: #6e5a5f;
      --accent: #b04a4a;
      --accent-hover: #7c1437;
      --accent-text: #ffffff;
      --card-media: #e8c9cf;
      --tag-bg: #f6e3e6;
      --tag-text: #520d24;
      --shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      --success: #2e7d32;
      --danger: #9b1c1c;
      color-scheme: light;
    }

    :root {
      --header-h: 84px;
      --radius: 20px;
      --radius-lg: 30px;
    }

    * { box-sizing: border-box; }

    h1, h2, h3 { font-family: "Asap", sans-serif; }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      padding: 0.7rem 1.5rem;
      border-radius: var(--radius);
      font-weight: bold;
      transition: transform 0.3s, background 0.2s, color 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button:not(.toggle-btn):not(.btn-round):not(.btn-carrito):not(.menu-item):hover {
      transform: translateY(-4px) scale(1.02);
    }

    .btn-secondary { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
    .btn-secondary:hover { background: var(--accent); color: var(--accent-text); }
    .btn-small { padding: 0.5rem 1.1rem; font-size: 0.85rem; }

    .btn-round {
      width: 50px;
      height: 50px;
      padding: 0;
      border-radius: 50%;
      font-size: 1.3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-round:hover { transform: translateY(-5px) !important; }

    input, select {
      font-family: inherit;
      font-size: 1rem;
      padding: 0.7rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--text);
      transition: border 0.2s;
      width: 100%;
    }
    input:focus { outline: none; border-color: var(--accent); }

    /* ---------- Header ---------- */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 2rem;
      height: var(--header-h);
    }
    .topbar-titulo { margin: 0; font-size: 1.7rem; font-weight: 700; letter-spacing: -1px; white-space: nowrap; }
    .topbar-titulo span { color: var(--accent); }

    .topbar .search-box { flex: 1; max-width: 560px; margin: 0 auto; position: relative; }

    /* Márgenes de ESTA página. Los componentes vienen de catalogo.css */
    .catalogo { padding: 0 2rem 2rem; }

    /* ---------- Celular ---------- */

    @media (max-width: 720px) {
      .topbar { height: auto; flex-wrap: wrap; gap: 0.75rem; padding: 0.9rem 1rem; }
      .topbar-titulo { flex: 1; font-size: 1.3rem; }
      .topbar .search-box { order: 10; flex-basis: 100%; max-width: none; }
      .catalogo { padding: 0 1rem 2rem; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <h1 class="topbar-titulo">Galería de <span>productos</span></h1>

    <div class="search-box">
      <input type="search" id="input-busqueda" placeholder="Buscar producto…" autocomplete="off" aria-label="Buscar producto">
    </div>

    <button id="btn-tema" class="btn-round" type="button" aria-label="Cambiar tema">☀</button>

    <button id="btn-abrir-carrito" class="btn-carrito" type="button" aria-label="Abrir carrito">
      🛒<span id="carrito-count" class="carrito-count"></span>
    </button>

    <!-- Círculo de perfil + menú (Mi cuenta, Mis pedidos…): js/perfilMenu.js -->
    <div id="perfil-global"></div>
  </header>

  <main class="catalogo">
    <div class="filtros">
      <select id="filtro-categoria" class="catalogo-control" aria-label="Filtrar por categoría">
        <option value="">Todas las categorías</option>
      </select>
      <select id="filtro-orden" class="catalogo-control" aria-label="Ordenar por">
        <option value="nombre">Nombre A–Z</option>
        <option value="nombre-desc">Nombre Z–A</option>
        <option value="precio">Precio: menor a mayor</option>
        <option value="precio-desc">Precio: mayor a menor</option>
      </select>
    </div>

    <div id="galeria" class="product-grid"></div>
  </main>

  <!-- Panel lateral del carrito -->
  <div id="carrito-overlay" class="carrito-overlay"></div>
  <aside id="carrito-panel" class="carrito-panel">
    <div class="carrito-header">
      <h2>Tu carrito</h2>
      <button id="btn-cerrar-carrito" class="btn-cerrar-carrito" type="button" aria-label="Cerrar carrito">&times;</button>
    </div>
    <div id="carrito-items" class="carrito-items"></div>
    <div class="carrito-footer">
      <div class="carrito-total">
        <span>Total</span>
        <span id="carrito-total-valor">$ 0</span>
      </div>
      <!-- Paso 6: el checkout va dentro del panel (antes era un botón a pago.html).
           Mismo bloque en cliente.html: los dos comparten catalogo.js -->
      <p id="mensaje-carrito" class="mensaje-carrito" role="status"></p>
      <form id="form-checkout" class="form-checkout" hidden>
        <label class="checkout-casilla">
          <input type="checkbox" id="checkout-envio"> Envío a domicilio
        </label>
        <label class="checkout-campo">Dirección
          <input type="text" id="checkout-direccion" class="catalogo-control" autocomplete="street-address" placeholder="Calle 10 # 20-30">
        </label>
        <label class="checkout-campo">Teléfono
          <input type="tel" id="checkout-telefono" class="catalogo-control" autocomplete="tel">
        </label>
        <label class="checkout-campo">Observación
          <textarea id="checkout-observacion" class="catalogo-control" rows="2"></textarea>
        </label>
        <button type="submit" id="btn-confirmar">Confirmar pedido</button>
        <button type="button" id="btn-cancelar-checkout" class="btn-secondary">Volver al carrito</button>
      </form>
      <button id="btn-checkout" type="button">Ir a pagar</button>
    </div>
  </aside>

  <!-- Modal de producto -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div id="modal-media" class="modal-media"></div>
      <button id="btn-cerrar-modal" class="btn-cerrar-modal" type="button" aria-label="Cerrar">&times;</button>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/perfilMenu.js"></script> <!-- círculo de perfil + menú -->
  <script src="js/catalogo.js"></script>  <!-- tarjetas, filtros, modal, carrito (compartido) -->
  <script src="js/galeria.js"></script>   <!-- solo lo propio de esta página: tema y arranque -->
</body>
</html>

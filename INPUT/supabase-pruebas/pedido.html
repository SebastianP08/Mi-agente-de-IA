<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis pedidos — Jaziz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tienda.css">
</head>
<body>

  <header class="topbar">
    <h1 class="topbar-titulo">Mis <span>pedidos</span></h1>
    <div class="topbar-acciones">
      <a class="btn btn-secondary btn-small" href="galeria.html">Galería</a>
      <a class="btn btn-secondary btn-small" href="cliente.html">Mi cuenta</a>
      <button id="btn-tema" class="btn-round" type="button" aria-label="Cambiar tema">☀</button>
    </div>
  </header>

  <!-- pedido.html (sin ?id) → lista de todos mis pedidos -->
  <main id="zona-lista" class="contenido" hidden>
    <h2 class="vista-titulo">Tus <span>compras</span></h2>
    <div id="lista-pedidos" class="lista-pedidos"></div>
  </main>

  <!-- pedido.html?id=5 → el detalle de ese pedido -->
  <main id="zona-detalle" class="contenido" hidden>
    <p><a href="pedido.html">← Todos mis pedidos</a></p>
    <h2 class="vista-titulo">Pedido <span id="detalle-numero"></span></h2>
    <p id="detalle-fecha" class="subtitulo"></p>

    <!-- Seguimiento -->
    <section class="panel">
      <div class="estado-cabecera">
        <div>
          <h3 id="estado-titulo" class="estado-titulo"></h3>
          <p id="estado-mensaje" class="estado-mensaje"></p>
        </div>
        <button id="btn-actualizar" type="button" class="btn-secondary btn-small">Actualizar</button>
      </div>

      <!-- data-estado y --progreso los pone pedido.js. El CSS usa los dos:
           --progreso mueve el camión y el relleno; data-estado="en_camino"
           activa el rebote -->
      <div id="tracker" class="tracker">
        <div class="tracker-pista">
          <div class="tracker-relleno"></div>
          <div class="tracker-camion" aria-hidden="true">
            <!-- Camión hecho a mano con formas básicas: rect = caja,
                 path = cabina, circle = ruedas. Los colores salen del CSS
                 (.camion-caja, etc.), por eso cambia con el tema -->
            <svg viewBox="0 0 72 44" xmlns="http://www.w3.org/2000/svg">
              <circle class="camion-humo" cx="4" cy="30" r="2.5" />
              <rect class="camion-caja" x="6" y="4" width="40" height="28" rx="4" />
              <path class="camion-cabina" d="M46 13h13l9 10v9H46z" />
              <path class="camion-ventana" d="M50 16h8l6 7H50z" />
              <circle class="camion-rueda" cx="18" cy="35" r="6" />
              <circle class="camion-rin" cx="18" cy="35" r="2.4" />
              <circle class="camion-rueda" cx="56" cy="35" r="6" />
              <circle class="camion-rin" cx="56" cy="35" r="2.4" />
            </svg>
          </div>
        </div>
        <!-- <ol> = lista ORDENADA: el orden de las etapas importa -->
        <ol id="tracker-pasos" class="tracker-pasos"></ol>
      </div>
    </section>

    <div class="dos-columnas" style="margin-top: 1.5rem;">
      <section class="panel">
        <h3>Productos</h3>
        <div id="detalle-items"></div>
        <div class="fila-total fila-total--grande"><span>Total pagado</span><span id="detalle-total"></span></div>
      </section>

      <aside class="columna-lateral">
        <section class="panel">
          <h3>Envío</h3>
          <dl id="detalle-envio" class="datos-lista"></dl>
        </section>
        <section class="panel">
          <h3>Pago</h3>
          <dl id="detalle-pago" class="datos-lista"></dl>
        </section>
      </aside>
    </div>

    <div id="mensaje-pedido" class="message"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/tienda.js"></script>
  <script src="js/pedidosLocal.js"></script>   <!-- pedidos en localStorage (temporal) -->
  <script src="js/pedido.js"></script>
</body>
</html>
